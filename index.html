<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti Mi Gordita Hermosa ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* Fondo de Constelaciones */
        #constellationCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Contenedor central */
        .content-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- EFECTO DEL CORAZÓN QUE SE ROMPE --- */
        .heart-container {
            position: relative;
            width: 100px;
            height: 100px;
            cursor: pointer;
            animation: pulse 1.2s infinite ease-in-out;
            z-index: 10;
            transition: all 0.5s;
        }

        .heart-half {
            position: absolute;
            top: 0;
            width: 52px;
            height: 80px;
            background: #ff2a6d;
            border-radius: 50px 50px 0 0;
            box-shadow: 0 0 25px rgba(255, 42, 109, 0.6);
            transition: all 1s ease-in-out; /* Duración de la animación de ruptura */
        }

        .heart-left {
            left: 50%;
            transform: translateX(-100%) rotate(-45deg);
            transform-origin: 100% 100%;
        }

        .heart-right {
            left: 50%;
            transform: rotate(45deg);
            transform-origin: 0 100%;
        }

        /* Animación cuando se rompe (se activa con JS) */
        .heart-container.broken {
            animation: none; /* Detiene el latido */
            pointer-events: none;
        }
        .heart-container.broken .heart-left {
            transform: translateX(-200%) rotate(-90deg) translateY(50px);
            opacity: 0;
        }
        .heart-container.broken .heart-right {
            transform: translateX(100%) rotate(90deg) translateY(50px);
            opacity: 0;
        }

        .click-text {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 0.7;
            transition: opacity 0.5s;
            pointer-events: none;
            text-align: center;
            width: 200px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* --- CARTA OCULTA QUE APARECE --- */
        .letter-container {
            background: rgba(10, 10, 25, 0.75);
            border: 1px solid rgba(255, 42, 109, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 35px;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            
            /* Oculto inicialmente */
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s ease-in-out;
            position: absolute;
            pointer-events: none;
        }

        /* Clase que lo hace aparecer */
        .letter-container.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        h1 {
            color: #ff2a6d;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 42, 109, 0.5);
        }
        .text-message {
            color: #e0e0f0;
            font-size: 1.1rem;
            line-height: 1.6;
            text-align: justify;
            min-height: 120px;
        }
        .signature {
            margin-top: 25px;
            text-align: right;
            color: #05d9e8;
            font-weight: bold;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 2s;
        }
    </style>
</head>
<body>

    <canvas id="constellationCanvas"></canvas>

    <div class="content-overlay">
        
        <div class="heart-container" id="heartBox" onclick="breakHeart()">
            <div class="heart-half heart-left"></div>
            <div class="heart-half heart-right"></div>
            <div class="click-text" id="clickText">Toca el corazón</div>
        </div>

        <div class="letter-container" id="letterBox">
            <h1>Para ti ❤️</h1>
            <p class="text-message" id="typewriter"></p>
            <div class="signature" id="signature">— Joandris</div>
        </div>

    </div>

    <script>
        // --- 1. CONFIGURACIÓN DE LA CARTA ---
        const cartaTexto = "Sé que las cosas entre nosotros no están bien ahora y que no nos estamos hablando, pero no quería dejar pasar el día sin darte este detalle. Diseñé esto para ti porque, aunque haya distancia o silencios, mi amor y lo que siento por ti sigue intacto, brillando como estas estrellas. Ojalá esto pueda romper el hielo. Te extraño.";
        
        let index = 0;
        const typewriterElement = document.getElementById('typewriter');

        function typeWriter() {
            if (index < cartaTexto.length) {
                typewriterElement.innerHTML += cartaTexto.charAt(index);
                index++;
                setTimeout(typeWriter, 40); // Velocidad al escribir
            } else {
                // Muestra la firma cuando termina de escribir
                document.getElementById('signature').style.opacity = 1;
            }
        }

        // --- 2. FUNCIÓN PARA ROMPER EL CORAZÓN ---
        function breakHeart() {
            const heart = document.getElementById('heartBox');
            const clickText = document.getElementById('clickText');
            const letter = document.getElementById('letterBox');

            // Añade la clase que rompe el corazón
            heart.classList.add('broken');
            clickText.style.opacity = '0'; // Oculta el texto de "Toca"

            // Espera a que termine la animación de romperse (1 segundo)
            setTimeout(() => {
                heart.style.display = 'none'; // Desaparece el corazón
                letter.classList.add('show'); // Hace aparecer la carta

                // Inicia el efecto de máquina de escribir 0.5 segundos después de que aparece la carta
                setTimeout(typeWriter, 500); 
            }, 1000);
        }


        // --- 3. EFECTO CONSTELLACIÓN (CANVAS BACKGROUND) ---
        const canvas = document.getElementById('constellationCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 90;
        const connectionDistance = 120;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(5, 217, 232, 0.8)';
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255, 42, 109, ${1 - distance / connectionDistance - 0.2})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // El fondo interactúa con el mouse/dedo
        window.addEventListener('pointermove', (e) => {
            if(particles.length > 0) {
                particles[0].x = e.clientX;
                particles[0].y = e.clientY;
            }
        });

        init();
        animate();
    </script>
</body>
</html>
