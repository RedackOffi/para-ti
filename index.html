<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti Mi Gordita Hermosa ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        #constellationCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .content-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            pointer-events: none; /* Permite interactuar con el canvas de fondo */
        }
        .heart-glow {
            width: 80px;
            height: 80px;
            position: relative;
            animation: pulse 1.5s infinite ease-in-out;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 20px #ff2a6d);
        }
        .heart-glow::before,
        .heart-glow::after {
            content: "";
            position: absolute;
            top: 0;
            width: 52px;
            height: 80px;
            border-radius: 50px 50px 0 0;
            background: #ff2a6d;
        }
        .heart-glow::before {
            left: 40px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        .heart-glow::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px #ff2a6d); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 30px #ff2a6d); }
            100% { transform: scale(1); filter: drop-shadow(0 0 15px #ff2a6d); }
        }
        .letter-container {
            background: rgba(10, 10, 25, 0.75);
            border: 1px solid rgba(255, 42, 109, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 25px;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            pointer-events: auto; /* Permite scroll si el texto es largo */
        }
        h1 {
            color: #ff2a6d;
            font-size: 1.6rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 42, 109, 0.5);
        }
        .text-message {
            color: #e0e0f0;
            font-size: 1rem;
            line-height: 1.6;
            text-align: justify;
            min-height: 80px;
        }
        .signature {
            margin-top: 20px;
            text-align: right;
            color: #05d9e8;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <canvas id="constellationCanvas"></canvas>

    <div class="content-overlay">
        <div class="heart-glow"></div>
        <div class="letter-container">
            <h1>Para el amor de mi vida ❤️</h1>
            <p class="text-message" id="typewriter"></p>
            <div class="signature">— Joandris</div>
        </div>
    </div>

    <script>
        // --- CÓDIGO DEL EFECTO CONSTELLACIÓN (CANVAS) ---
        const canvas = document.getElementById('constellationCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 70;
        const connectionDistance = 100;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.radius = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(5, 217, 232, 0.8)';
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar líneas (Constelaciones)
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const db = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + db * db);
                    
                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255, 42, 109, ${1 - distance / connectionDistance - 0.3})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Interactividad táctil / mouse para mover partículas cercanas
        window.addEventListener('pointermove', (e) => {
            if(particles.length > 0) {
                particles[0].x = e.clientX;
                particles[0].y = e.clientY;
            }
        });

        init();
        animate();

        // --- CÓDIGO MAQUINA DE ESCRIBIR (TU CARTA) ---
        // Pon aquí adentro lo que le quieras decir. Al ser un string de JS, usa \n para saltos de línea.
        const cartaTexto = "Sé que las cosas entre nosotros no están bien ahora y que no nos estamos hablando, pero no quería dejar pasar el día sin darte este detalle. Diseñé esto para ti porque, aunque haya distancia o silencios, mi amor y lo que siento por ti sigue intacto, brillando como estas estrellas. Ojalá esto pueda romper el hielo. Te extraño.";
        
        const typewriterElement = document.getElementById('typewriter');
        let index = 0;

        function type() {
            if (index < cartaTexto.length) {
                typewriterElement.innerHTML += cartaTexto.charAt(index);
                index++;
                setTimeout(type, 40); // Velocidad de escritura (en milisegundos)
            }
        }
        
        // Iniciar máquina de escribir un segundo después de cargar
        setTimeout(type, 1000);
    </script>
</body>
</html>
